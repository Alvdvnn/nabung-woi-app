<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Concept B: Piggy. A minimal piggy bank built from circles, with a coin above the slot. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- legs -->
  <rect x="380" y="700" width="90" height="120" rx="40" fill="#f3e6c8"/>
  <rect x="610" y="700" width="90" height="120" rx="40" fill="#f3e6c8"/>
  <!-- ear -->
  <path d="M640 330 L730 300 L720 420 Z" fill="#f3e6c8" stroke="#f3e6c8" stroke-width="40" stroke-linejoin="round"/>
  <!-- body -->
  <circle cx="540" cy="560" r="250" fill="#fff8e7"/>
  <!-- snout -->
  <circle cx="300" cy="590" r="92" fill="#fff8e7"/>
  <circle cx="276" cy="580" r="14" fill="#0f766e"/>
  <circle cx="276" cy="620" r="14" fill="#0f766e"/>
  <!-- eye -->
  <circle cx="430" cy="500" r="24" fill="#0f766e"/>
  <!-- slot -->
  <rect x="480" y="300" width="130" height="30" rx="15" fill="#0f766e"/>

  <!-- coin -->
  <circle cx="545" cy="200" r="72" fill="#f7b928"/>
  <circle cx="545" cy="200" r="48" fill="none" stroke="#d6940c" stroke-width="12"/>
</svg>
