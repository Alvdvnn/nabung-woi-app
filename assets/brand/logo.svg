<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Nabung Woi master logo (concept A: coin jar).
    Artwork stays inside the 80% maskable safe circle, so the same file serves
    app icon, PWA "any" and "maskable" icons. `logo-mark.svg` is the artwork
    alone; `scripts/gen-icons.mjs` renders every raster size from these two.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- jar body -->
  <rect x="302" y="392" width="420" height="440" rx="96" fill="#fff8e7"/>
  <rect x="302" y="392" width="420" height="40" fill="#f3e6c8"/>
  <!-- lid + slot -->
  <rect x="342" y="312" width="340" height="96" rx="30" fill="#0f766e"/>
  <rect x="452" y="344" width="120" height="30" rx="15" fill="#fff8e7"/>
  <!-- label with up arrow -->
  <rect x="402" y="560" width="220" height="110" rx="26" fill="#0d9488"/>
  <path d="M452 644 L512 588 L572 644" fill="none" stroke="#fff8e7" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- coin -->
  <circle cx="512" cy="212" r="78" fill="#f7b928"/>
  <circle cx="512" cy="212" r="52" fill="none" stroke="#d6940c" stroke-width="12"/>
</svg>
